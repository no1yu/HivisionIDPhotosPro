<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HivisionIDPhotos Pro</title>
    <style>
        :root{--primary:#2356d7;--primary-soft:rgba(35,86,215,.1);--sidebar:#263445;--page:#f0f2f5;--text:#212529;--muted:#6c757d;--line:#e4e7eb;--soft:#f6f7f9;--danger:#d61f47;--success:#139a52}
        *{box-sizing:border-box}
        body{margin:0;background:var(--page);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",Arial,sans-serif;font-size:14px}
        button,input,select{font:inherit}
        button,label{cursor:pointer}
        .page{min-height:100vh}
        header{height:76px;display:flex;align-items:center;padding:0 28px;background:#fff;box-shadow:0 1px 2px rgba(214,219,226,.65);position:relative;z-index:2}
        .brand{display:flex;align-items:center;gap:12px}
        .brand-logo{width:48px;height:48px;border-radius:8px;object-fit:cover}
        h1{margin:0;color:#334155;font-size:24px;font-weight:650;letter-spacing:.1px}
        .app-shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:calc(100vh - 76px)}
        .app-content{min-width:0;padding:27px 30px 40px}
        .tabs{display:flex;flex-direction:column;gap:2px;padding:22px 14px;background:var(--sidebar)}
        .tabs::before{content:"功能菜单";padding:0 12px 10px;color:rgba(159,174,193,.58);font-size:11px;font-weight:600;letter-spacing:1px}
        .tab{width:100%;min-height:42px;padding:10px 12px;border:0;border-radius:4px;background:transparent;color:#9faec1;font-size:14px;font-weight:500;text-align:left;transition:background-color .18s ease,color .18s ease}
        .tab:hover{background:rgba(0,0,0,.18);color:#fff}
        .tab.active{background:rgba(255,255,255,.09);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
        .feature-title{margin:0 0 19px;font-size:23px;font-weight:600;color:#334155}
        .workbench{display:grid;grid-template-columns:minmax(390px,.92fr) minmax(470px,1.08fr);gap:24px;align-items:start}
        .panel{background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(214,219,226,.6),0 1px 2px rgba(214,219,226,.6)}
        .panel-title{padding:11px 20px;background:var(--soft);font-size:13px;font-weight:600;line-height:28px;letter-spacing:.6px}
        .panel-body{padding:20px}
        .upload-box{height:310px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px dashed #c8ced7;border-radius:3px;background:#fbfcfd;color:var(--muted);text-align:center;transition:border-color .18s ease,background-color .18s ease}
        .upload-box.dragging{border-color:var(--primary);background:var(--primary-soft)}
        .upload-box:hover{border-color:#8fa4c4;background:#f8f9fb}
        .upload-box.has-image{background-color:#fafafa;background-image:linear-gradient(45deg,#edf0f3 25%,transparent 25%),linear-gradient(-45deg,#edf0f3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#edf0f3 75%),linear-gradient(-45deg,transparent 75%,#edf0f3 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
        .upload-empty strong{display:block;margin-bottom:7px;color:#334155;font-size:15px;font-weight:600}
        .upload-empty span{font-size:13px}
        .upload-preview{display:none;width:100%;height:100%;object-fit:contain}
        .upload-box.has-image .upload-empty{display:none}
        .upload-box.has-image .upload-preview{display:block}
        #input-file{display:none}
        .groups{margin-top:24px}
        .param-box{overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(214,219,226,.6),0 1px 2px rgba(214,219,226,.6)}
        .param-tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--soft)}
        .param-tab{padding:13px 12px 11px;border:0;border-bottom:2px solid transparent;background:transparent;color:#5b6573;font-size:13px}
        .param-tab:hover{color:var(--primary)}
        .param-tab.active{border-bottom-color:var(--primary);color:var(--primary);font-weight:600}
        .param-page{display:none}
        .param-page.active{display:block}
        .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;padding:20px}
        .field.full{grid-column:1/-1}
        .label{display:block;margin-bottom:7px;color:#374151;font-size:13px;font-weight:600}
        .required{margin-left:3px;color:var(--danger)}
        .control{width:100%;height:40px;padding:0 11px;border:1px solid #d5dae1;border-radius:3px;outline:none;background:#fff;color:var(--text);transition:border-color .18s ease,box-shadow .18s ease}
        .control:focus{border-color:#7896e4;box-shadow:0 0 0 3px var(--primary-soft)}
        .help{margin:6px 0 0;color:#8a94a3;font-size:12px;line-height:1.4}
        .color-row{display:grid;grid-template-columns:42px 1fr;gap:7px}
        .color-picker{width:42px;height:40px;padding:3px;border:1px solid #d5dae1;border-radius:3px;background:#fff}
        .optional-file{height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 7px 5px 10px;border:1px solid #d5dae1;border-radius:3px}
        .optional-file span{min-width:0;overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
        .optional-file label{padding:5px 9px;border-radius:3px;background:#ebeef2;color:#475569;font-size:12px}
        .optional-file input{display:none}
        .start{width:100%;height:44px;margin-top:20px;border:0;border-radius:3px;background:var(--primary);color:#fff;font-weight:600;box-shadow:0 2px 5px rgba(35,86,215,.2)}
        .start:hover{background:#1d48b5}
        .start:disabled{cursor:not-allowed;opacity:.65}
        .message{display:none;margin-top:12px;padding:10px 12px;border-radius:3px;font-size:13px;line-height:1.5}
        .message.error{display:block;background:#fbe8ec;color:#a71737}
        .message.success{display:block;background:#e5f5ec;color:#107840}
        .result-panel{min-height:660px}
        .result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .result-item{min-width:0;border:1px solid var(--line);overflow:hidden;background:#fff}
        .result-item.wide{grid-column:1/-1}
        .result-label{padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfbfc;font-size:13px;font-weight:600}
        .result-view{height:270px;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:#fafafa;background-image:linear-gradient(45deg,#edf0f3 25%,transparent 25%),linear-gradient(-45deg,#edf0f3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#edf0f3 75%),linear-gradient(-45deg,transparent 75%,#edf0f3 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
        .result-item.wide .result-view{height:330px}
        .result-placeholder{color:#8a94a3;font-size:13px}
        .result-view.loading .result-placeholder{display:none}
        .result-loading{display:none;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:13px}
        .result-view.loading .result-loading{display:flex}
        .result-spinner{width:34px;height:34px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:result-spin .75s linear infinite}
        @keyframes result-spin{to{transform:rotate(360deg)}}
        .result-image{display:none;width:100%;height:100%;object-fit:contain}
        .result-info{display:none;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
        .result-meta{min-width:0;color:#7c8796;font-size:11px}
        .download{flex:0 0 auto;color:var(--primary);font-size:12px;font-weight:600;text-decoration:none}
        .single-result .result-view{height:570px}
        .json-result{display:none;width:100%;padding:20px;background:#fff}
        .score{display:grid;grid-template-columns:70px 1fr 56px;align-items:center;gap:10px;margin:14px 0}
        .score-name{font-size:13px}
        .score-track{height:7px;overflow:hidden;border-radius:99px;background:#eceff3}
        .score-bar{display:block;height:100%;border-radius:99px;background:var(--primary)}
        .score-number{text-align:right;color:var(--muted);font-size:12px}
        @media(max-width:1080px){.workbench{grid-template-columns:1fr}.result-panel{min-height:0}}
        @media(max-width:760px){header{height:68px;padding:0 18px}.brand-logo{width:42px;height:42px}.brand h1{font-size:20px}.app-shell{display:block;min-height:calc(100vh - 68px)}.tabs{flex-direction:row;overflow-x:auto;padding:10px 12px}.tabs::before{display:none}.tab{width:auto;flex:0 0 auto;white-space:nowrap}.app-content{padding:20px 14px 30px}}
        @media(max-width:640px){.fields,.result-grid{grid-template-columns:1fr}.result-item.wide{grid-column:auto}.upload-box{height:260px}.panel-body,.fields{padding:15px}}
    </style>
</head>
<body>
    <div class="page">
        <header>
            <div class="brand">
                <img class="brand-logo" src="hivision-logo-pro.png" alt="HivisionIDPhotos Pro">
                <h1>HivisionIDPhotos Pro</h1>
            </div>
        </header>
        <div class="app-shell">
            <nav class="tabs" id="tabs"></nav>
            <div class="app-content">
                <h2 class="feature-title" id="feature-title"></h2>
                <main class="workbench">
            <section>
                <div class="panel">
                    <div class="panel-title">图片</div>
                    <div class="panel-body">
                        <label class="upload-box" id="upload-box" for="input-file">
                            <span class="upload-empty"><strong>上传图片</strong><span>点击或拖入图片</span></span>
                            <img class="upload-preview" id="input-preview" alt="上传图片">
                        </label>
                        <input id="input-file" type="file" accept="image/*">
                    </div>
                </div>

                <div class="groups" id="groups"></div>
                <button class="start" id="start" type="button">开始制作</button>
                <div class="message" id="message"></div>
            </section>

            <section class="panel result-panel">
                <div class="panel-title">输出</div>
                <div class="panel-body" id="results"></div>
            </section>
                </main>
            </div>
        </div>
    </div>

    <script>
        const humanModels=[{value:"ppMattingV2",label:"PP-MattingV2"},{value:"hivisionModnet",label:"hivision_modnet"},{value:"modnetPhotographic",label:"MODNet"},{value:"rmbg",label:"RMBG-1.4"},{value:"silueta",label:"Silueta"},{value:"birefnet",label:"BiRefNet v1 Lite"}]
        const faceModels=[{value:"yunet",label:"YuNet"},{value:"mtcnn",label:"MTCNN"},{value:"retinaface",label:"RetinaFace ResNet50"}]
        const boolOptions=[{value:"true",label:"开启"},{value:"false",label:"关闭"}]
        const presetSizes={
            one:{label:"一寸",height:413,width:295},two:{label:"二寸",height:626,width:413},smallOne:{label:"小一寸",height:378,width:260},smallTwo:{label:"小二寸",height:531,width:413},largeOne:{label:"大一寸",height:567,width:390},largeTwo:{label:"大二寸",height:626,width:413},five:{label:"五寸",height:1499,width:1050},teacher:{label:"教师资格证",height:413,width:295},civil:{label:"国家公务员考试",height:413,width:295},accounting:{label:"初级会计考试",height:413,width:295},cet:{label:"英语四六级考试",height:192,width:144},computer:{label:"计算机等级考试",height:567,width:390},postgraduate:{label:"研究生考试",height:709,width:531},social:{label:"社保卡",height:441,width:358},driver:{label:"电子驾驶证",height:378,width:260},usa:{label:"美国签证",height:600,width:600},japan:{label:"日本签证",height:413,width:295},korea:{label:"韩国签证",height:531,width:413}
        }
        const sizeOptions=Object.entries(presetSizes).map(([value,size])=>({value,label:`${size.label}（${size.width}×${size.height}px）`})).concat({value:"custom",label:"自定义尺寸"})
        const dpi={name:"dpi",label:"DPI",type:"number",value:300,min:1}
        const kb={name:"kb",label:"目标KB",type:"number",placeholder:"不设置",min:1,help:"只用于标准证件照"}
        const matting={name:"human_matting_model",label:"人像分割模型",type:"select",value:"ppMattingV2",options:humanModels}
        const face={name:"face_detect_model",label:"人脸检测模型",type:"select",value:"yunet",options:faceModels}

        const idPhotoGroups=[
            {title:"核心参数",fields:[
                {name:"preset_size",label:"证件照尺寸",type:"select",value:"one",options:sizeOptions,full:true},
                {name:"custom_height",label:"自定义高度",type:"number",min:1,placeholder:"像素",hidden:true},
                {name:"custom_width",label:"自定义宽度",type:"number",min:1,placeholder:"像素",hidden:true},
                {name:"color",label:"背景颜色",type:"color",value:"#438EDB"},
                {name:"render",label:"渲染方式",type:"select",value:"0",options:[{value:"0",label:"纯色"},{value:"1",label:"上下渐变"},{value:"2",label:"中心渐变"}]},dpi,kb
            ]},
            {title:"高级参数",fields:[
                matting,face,{name:"face_align",label:"头部倾斜矫正",type:"select",value:"false",options:boolOptions},
                {name:"head_measure_ratio",label:"面部比例",type:"number",value:0.2,min:0.01,max:1,step:0.01},
                {name:"head_height_ratio",label:"面部中心高度",type:"number",value:0.45,min:0.01,max:1,step:0.01},
                {name:"top_distance_max",label:"头顶最大距离",type:"number",value:0.12,min:0,step:0.01},
                {name:"top_distance_min",label:"头顶最小距离",type:"number",value:0.10,min:0,step:0.01},
                {name:"whitening_strength",label:"美白",type:"number",value:0,step:1},
                {name:"brightness_strength",label:"亮度",type:"number",value:0,step:0.1},
                {name:"contrast_strength",label:"对比度",type:"number",value:0,step:0.1},
                {name:"sharpen_strength",label:"锐化",type:"number",value:0,step:0.1},
                {name:"saturation_strength",label:"饱和度",type:"number",value:0,step:0.1}
            ]},
            {title:"换装设置",fields:[
                {name:"clothes_category",label:"服装分类",type:"select",value:"0",options:[{value:"0",label:"不换装"},{value:"1",label:"男装"},{value:"2",label:"女装"},{value:"3",label:"儿童装"}]},
                {name:"clothes_id",label:"服装编号",type:"number",value:0,min:0,max:0},
                {name:"clothes_face_detect_model",label:"换装人脸检测模型",type:"select",value:"yunet",options:faceModels},
                {name:"clothes_parsing_model",label:"换装人体解析模型",type:"select",value:"selfieMulticlass",options:[{value:"selfieMulticlass",label:"Selfie Multiclass"}]}
            ]},
            {title:"排版设置",fields:[
                {name:"layout_size",label:"相纸尺寸",type:"select",value:"six_inch",options:[{value:"six_inch",label:"六寸"},{value:"five_inch",label:"五寸"},{value:"a4",label:"A4"},{value:"three_r",label:"3R"},{value:"four_r",label:"4R"},{value:"custom",label:"自定义画布"}]},
                {name:"crop_line",label:"裁切线",type:"select",value:"false",options:boolOptions},
                {name:"layout_height",label:"画布高度",type:"number",min:1,placeholder:"像素",hidden:true},
                {name:"layout_width",label:"画布宽度",type:"number",min:1,placeholder:"像素",hidden:true}
            ]}
        ]

        const features=[
            {id:"idphoto",title:"证件照",workflow:true,groups:idPhotoGroups},
            {id:"couple",title:"情侣红底照",endpoint:"/couple_red_photo",download:"couple-red-photo",groups:[
                {title:"核心参数",fields:[{name:"color",label:"背景颜色",type:"select",value:"#5C1117",options:[{value:"#5C1117",label:"酒红渐变"},{value:"#D9001B",label:"正红"},{value:"#D12C25",label:"朱红"},{value:"#FF2121",label:"鲜红"},{value:"#FF0000",label:"纯红"},{value:"#FF4C00",label:"橙红"},{value:"#9D2933",label:"胭脂红"},{value:"#ED333D",label:"珊瑚红"}]}]},
                {title:"高级参数",fields:[matting,face,dpi]}
            ]},
            {id:"american",title:"美式证件照",endpoint:"/american_idphoto",download:"american-idphoto",groups:[
                {title:"核心参数",fields:[{name:"height",label:"高度",type:"number",value:600,min:1},{name:"width",label:"宽度",type:"number",value:600,min:1}]},
                {title:"高级参数",fields:[matting,face,{name:"face_align",label:"头部倾斜矫正",type:"select",value:"true",options:boolOptions},{name:"background",label:"内置背景",type:"select",value:"american",options:[{value:"american",label:"美式背景"}]},dpi,{...kb,help:"留空不限制"}]}
            ]},
            {id:"template",title:"社交媒体模板照",endpoint:"/generate_template_photos",download:"template-photo",groups:[
                {title:"核心参数",fields:[{name:"template_name",label:"模板",type:"select",value:"template_1",options:[{value:"template_1",label:"模板一"},{value:"template_2",label:"模板二"}]},{name:"color",label:"背景颜色",type:"color",value:"#438EDB"}]},
                {title:"高级参数",fields:[{name:"height",label:"高度",type:"number",value:413,min:1},{name:"width",label:"宽度",type:"number",value:295,min:1},matting,face,{name:"face_align",label:"头部倾斜矫正",type:"select",value:"true",options:boolOptions},dpi,{...kb,help:"留空不限制"}]}
            ]},
            {id:"matting",title:"图片抠图",endpoint:"/human_matting",download:"matting",groups:[{title:"参数设置",fields:[matting,dpi]}]},
            {id:"cartoon",title:"图片转动漫风",endpoint:"/cartoon",download:"cartoon",groups:[{title:"参数设置",fields:[{name:"cartoon_model",label:"动漫风模型",type:"select",value:"cartoon",options:[{value:"cartoon",label:"DCT-Net"}]}]}]},
            {id:"colourize",title:"黑白照片上色",endpoint:"/colourizeImg",download:"colourized",groups:[{title:"参数设置",fields:[{name:"colourize_model",label:"上色模型",type:"select",value:"ddcolor",options:[{value:"ddcolor",label:"DDColor"}]},dpi]}]},
            {id:"deblur",title:"模糊图片变清晰",endpoint:"/deblur",download:"deblurred",groups:[{title:"参数设置",fields:[{name:"deblur_model",label:"清晰度增强模型",type:"select",value:"realEsrgan",options:[{value:"realEsrgan",label:"Real-ESRGAN"}]},dpi]}]},
            {id:"watermark",title:"图片添加水印",endpoint:"/watermark",download:"watermarked",groups:[
                {title:"核心参数",fields:[{name:"text",label:"水印文字",type:"text",required:true,full:true},{name:"style",label:"水印样式",type:"select",value:"striped",options:[{value:"striped",label:"斜纹平铺"},{value:"central",label:"居中"}]},{name:"color",label:"水印颜色",type:"color",value:"#171717"}]},
                {title:"高级参数",fields:[{name:"angle",label:"旋转角度",type:"number",value:30},{name:"opacity",label:"不透明度",type:"number",value:0.3,min:0,max:1,step:0.05},{name:"size",label:"字号",type:"number",value:40,min:1},{name:"space",label:"间距",type:"number",value:120,min:0},dpi,{...kb,help:"留空不限制"}]}
            ]},
            {id:"compress",title:"图片KB压缩",endpoint:"/set_kb",download:"compressed",groups:[{title:"参数设置",fields:[{name:"kb",label:"目标KB",type:"number",value:50,min:1,required:true},dpi]}]},
            {id:"format",title:"图片格式转换",endpoint:"/convert_image_format",download:"converted",groups:[{title:"参数设置",fields:[{name:"target_format",label:"目标格式",type:"select",value:"jpg",options:[{value:"jpg",label:"JPG"},{value:"jpeg",label:"JPEG"},{value:"png",label:"PNG"},{value:"gif",label:"GIF"}]}]}]},
            {id:"check",title:"图片鉴黄",endpoint:"/checkImg",groups:[]}
        ]

        const state={feature:features[0],file:null,inputUrl:null,resultUrls:[]}
        const tabs=document.getElementById("tabs")
        const title=document.getElementById("feature-title")
        const groups=document.getElementById("groups")
        const results=document.getElementById("results")
        const inputFile=document.getElementById("input-file")
        const uploadBox=document.getElementById("upload-box")
        const inputPreview=document.getElementById("input-preview")
        const start=document.getElementById("start")
        const message=document.getElementById("message")

        function renderTabs(){
            tabs.innerHTML=""
            features.forEach(feature=>{
                const button=document.createElement("button")
                button.type="button";button.className="tab";button.dataset.id=feature.id;button.textContent=feature.title
                button.addEventListener("click",()=>selectFeature(feature.id));tabs.appendChild(button)
            })
        }

        function selectFeature(id){
            state.feature=features.find(feature=>feature.id===id)
            document.querySelectorAll(".tab").forEach(button=>button.classList.toggle("active",button.dataset.id===id))
            title.textContent=state.feature.title;renderGroups();renderResults();clearMessage()
        }

        function renderGroups(){
            groups.innerHTML=""
            if(state.feature.groups.length===0){bindRelations();return}
            const box=document.createElement("div");box.className="param-box"
            const paramTabs=document.createElement("div");paramTabs.className="param-tabs"
            const paramPages=document.createElement("div");paramPages.className="param-pages"
            state.feature.groups.forEach((group,index)=>{
                const button=document.createElement("button");button.type="button";button.className="param-tab"+(index===0?" active":"");button.textContent=group.title
                const page=document.createElement("div");page.className="param-page"+(index===0?" active":"")
                const fields=document.createElement("div");fields.className="fields"
                group.fields.forEach(field=>fields.appendChild(createField(field)))
                page.appendChild(fields)
                button.addEventListener("click",()=>{
                    paramTabs.querySelectorAll(".param-tab").forEach(item=>item.classList.remove("active"))
                    paramPages.querySelectorAll(".param-page").forEach(item=>item.classList.remove("active"))
                    button.classList.add("active");page.classList.add("active")
                })
                paramTabs.appendChild(button);paramPages.appendChild(page)
            })
            box.append(paramTabs,paramPages);groups.appendChild(box)
            bindRelations()
        }

        function createField(field){
            const row=document.createElement("div");row.className="field"+(field.full?" full":"");row.dataset.row=field.name;if(field.hidden)row.hidden=true
            const id="field-"+field.name,label=document.createElement("label");label.className="label";label.htmlFor=id;label.textContent=field.label
            if(field.required){const required=document.createElement("span");required.className="required";required.textContent="*";label.appendChild(required)}
            row.appendChild(label)
            if(field.type==="select"){
                const control=document.createElement("select");control.id=id;control.className="control";control.dataset.fieldName=field.name
                field.options.forEach(option=>{const item=document.createElement("option");item.value=option.value;item.textContent=option.label;control.appendChild(item)})
                control.value=field.value;row.appendChild(control)
            }else if(field.type==="color"){
                const wrapper=document.createElement("div");wrapper.className="color-row"
                const picker=document.createElement("input");picker.type="color";picker.className="color-picker";picker.value=field.value.toLowerCase()
                const control=document.createElement("input");control.type="text";control.id=id;control.className="control";control.dataset.fieldName=field.name;control.value=field.value.toUpperCase()
                picker.addEventListener("input",()=>control.value=picker.value.toUpperCase());control.addEventListener("input",()=>{if(/^#[0-9a-fA-F]{6}$/.test(control.value))picker.value=control.value})
                wrapper.append(picker,control);row.appendChild(wrapper)
            }else if(field.type==="file"){
                const wrapper=document.createElement("div");wrapper.className="optional-file"
                const name=document.createElement("span");name.textContent="未选择图片"
                const choose=document.createElement("label");choose.textContent="选择图片"
                const control=document.createElement("input");control.type="file";control.accept="image/*";control.id=id;control.dataset.fieldName=field.name
                control.addEventListener("change",()=>name.textContent=control.files[0]?control.files[0].name:"未选择图片")
                choose.appendChild(control);wrapper.append(name,choose);row.appendChild(wrapper)
            }else{
                const control=document.createElement("input");control.type=field.type;control.id=id;control.className="control";control.dataset.fieldName=field.name
                if(field.value!==undefined)control.value=field.value;if(field.placeholder)control.placeholder=field.placeholder;if(field.min!==undefined)control.min=field.min;if(field.max!==undefined)control.max=field.max;if(field.step!==undefined)control.step=field.step
                row.appendChild(control)
            }
            if(field.help){const help=document.createElement("p");help.className="help";help.textContent=field.help;row.appendChild(help)}
            return row
        }

        function bindRelations(){
            const preset=getControl("preset_size")
            if(preset){const toggle=()=>{const custom=preset.value==="custom";document.querySelector('[data-row="custom_height"]').hidden=!custom;document.querySelector('[data-row="custom_width"]').hidden=!custom};preset.addEventListener("change",toggle);toggle()}
            const category=getControl("clothes_category")
            if(category){const clothesId=getControl("clothes_id"),update=()=>{if(category.value==="0"){clothesId.value=0;clothesId.min=0;clothesId.max=0;clothesId.disabled=true}else{clothesId.disabled=false;clothesId.min=1;clothesId.max=category.value==="3"?9:17;if(Number(clothesId.value)<1||Number(clothesId.value)>Number(clothesId.max))clothesId.value=1}};category.addEventListener("change",update);update()}
            const layout=getControl("layout_size")
            if(layout){const toggle=()=>{const custom=layout.value==="custom";document.querySelector('[data-row="layout_height"]').hidden=!custom;document.querySelector('[data-row="layout_width"]').hidden=!custom};layout.addEventListener("change",toggle);toggle()}
        }

        function renderResults(){
            clearResultUrls()
            results.innerHTML=state.feature.workflow?`<div class="result-grid">${resultItem("standard","标准证件照",false)}${resultItem("hd","高清证件照",false)}${resultItem("layout","排版照",true)}</div>`:`<div class="result-grid single-result">${resultItem("single","处理结果",true)}</div>`
        }

        function resultItem(id,label,wide){return `<div class="result-item${wide?" wide":""}" id="result-${id}"><div class="result-label">${label}</div><div class="result-view"><span class="result-placeholder">暂无结果</span><div class="result-loading"><span class="result-spinner"></span><span>正在处理</span></div><img class="result-image" alt="${label}"><div class="json-result"></div></div><div class="result-info"><span class="result-meta"></span><a class="download">下载</a></div></div>`}
        function getControl(name){return document.querySelector(`[data-field-name="${name}"]`)}
        function value(name){const control=getControl(name);return control?control.value.trim():""}

        function setFile(file){
            if(!file||!file.type.startsWith("image/")){showMessage("请选择有效的图片文件","error");return}
            state.file=file;if(state.inputUrl)URL.revokeObjectURL(state.inputUrl);state.inputUrl=URL.createObjectURL(file);inputPreview.src=state.inputUrl;uploadBox.classList.add("has-image");renderResults();clearMessage()
        }

        function clearResultUrls(){state.resultUrls.forEach(url=>URL.revokeObjectURL(url));state.resultUrls=[]}
        function clearMessage(){message.className="message";message.textContent=""}
        function showMessage(text,type){message.className="message "+type;message.textContent=text}
        function setBusy(busy,text){start.disabled=busy;start.textContent=busy?text:"开始制作"}
        function setResultBusy(busy){document.querySelectorAll(".result-view").forEach(view=>view.classList.toggle("loading",busy))}

        async function request(endpoint,formData){
            const response=await fetch(endpoint,{method:"POST",body:formData}),type=response.headers.get("content-type")||""
            if(!response.ok){let text="图片处理失败";if(type.includes("application/json")){const data=await response.json();if(data.msg)text=data.msg}throw new Error(text)}
            if(type.includes("application/json"))return{json:await response.json(),type}
            return{blob:await response.blob(),type}
        }

        function append(form,names){names.forEach(name=>{const control=getControl(name);if(!control||control.disabled)return;if(control.type==="file"){if(control.files[0])form.append(name,control.files[0],control.files[0].name)}else if(control.value.trim()!=="")form.append(name,control.value.trim())})}

        function photoSize(){
            const preset=value("preset_size");if(preset!=="custom")return presetSizes[preset]
            const height=Number(value("custom_height")),width=Number(value("custom_width"));if(height<1||width<1)throw new Error("请填写自定义证件照尺寸");return{height,width}
        }

        function idPhotoForm(hd,size){
            const form=new FormData();form.append("input_image",state.file,state.file.name);form.append("height",size.height);form.append("width",size.width);form.append("hd",hd)
            append(form,["human_matting_model","face_detect_model","dpi","face_align","head_measure_ratio","head_height_ratio","top_distance_max","top_distance_min","whitening_strength","brightness_strength","contrast_strength","sharpen_strength","saturation_strength"]);return form
        }

        function finishPhotoForm(blob,standard){
            const form=new FormData();form.append("input_image",blob,"idphoto.png");append(form,["color","dpi","render"]);if(standard&&value("kb")!=="")form.append("kb",value("kb"))
            const category=value("clothes_category");if(category!=="0")append(form,["clothes_category","clothes_id","clothes_face_detect_model","clothes_parsing_model"])
            return{endpoint:category==="0"?"/add_background":"/change_clothes",form}
        }

        function layoutForm(blob,size){
            const form=new FormData();form.append("input_image",blob,"standard.png");form.append("height",size.height);form.append("width",size.width);append(form,["dpi","crop_line"])
            if(value("layout_size")==="custom"){if(Number(value("layout_height"))<1||Number(value("layout_width"))<1)throw new Error("请填写自定义画布尺寸");append(form,["layout_height","layout_width"])}else form.append("layout_size",value("layout_size"));return form
        }

        function showImage(id,blob,type,name){
            const item=document.getElementById("result-"+id),image=item.querySelector(".result-image"),placeholder=item.querySelector(".result-placeholder"),info=item.querySelector(".result-info"),meta=item.querySelector(".result-meta"),download=item.querySelector(".download")
            item.querySelector(".result-view").classList.remove("loading")
            const url=URL.createObjectURL(blob);state.resultUrls.push(url);image.src=url;image.style.display="block";placeholder.style.display="none";info.style.display="flex"
            const ext=type.includes("jpeg")?"jpg":type.includes("gif")?"gif":"png";download.href=url;download.download=name+"."+ext;image.onload=()=>meta.textContent=`${image.naturalWidth}×${image.naturalHeight}px · ${(blob.size/1024).toFixed(1)}KB`
        }

        function showScores(data){
            const item=document.getElementById("result-single"),placeholder=item.querySelector(".result-placeholder"),json=item.querySelector(".json-result"),labels={drawings:"绘画",hentai:"色情动漫",neutral:"中性",porn:"色情",sexy:"性感"};json.innerHTML=""
            item.querySelector(".result-view").classList.remove("loading")
            Object.entries(labels).forEach(([key,label])=>{const score=Number(data[key]||0),row=document.createElement("div");row.className="score";row.innerHTML=`<span class="score-name">${label}</span><span class="score-track"><span class="score-bar" style="width:${Math.min(100,Math.max(0,score*100))}%"></span></span><span class="score-number">${(score*100).toFixed(2)}%</span>`;json.appendChild(row)})
            placeholder.style.display="none";json.style.display="block"
        }

        async function makeIdPhoto(){
            const size=photoSize();setBusy(true,"正在生成标准照");const standardTransparent=(await request("/idphoto",idPhotoForm("false",size))).blob
            setBusy(true,"正在生成高清照");const hdTransparent=(await request("/idphoto",idPhotoForm("true",size))).blob
            setBusy(true,"正在合成标准照");const standardRequest=finishPhotoForm(standardTransparent,true),standard=await request(standardRequest.endpoint,standardRequest.form);showImage("standard",standard.blob,standard.type,"standard-idphoto")
            setBusy(true,"正在合成高清照");const hdRequest=finishPhotoForm(hdTransparent,false),hd=await request(hdRequest.endpoint,hdRequest.form);showImage("hd",hd.blob,hd.type,"hd-idphoto")
            setBusy(true,"正在生成排版照");const layout=await request("/generate_layout_photos",layoutForm(standard.blob,size));showImage("layout",layout.blob,layout.type,"layout-photo")
        }

        function genericForm(){
            const form=new FormData();form.append("input_image",state.file,state.file.name)
            state.feature.groups.flatMap(group=>group.fields).forEach(field=>{const control=getControl(field.name);if(!control)return;if(control.type==="file"){if(control.files[0])form.append(field.name,control.files[0],control.files[0].name);return}const fieldValue=control.value.trim();if(fieldValue===""){if(field.required)throw new Error("请填写"+field.label);return}if(field.type==="color"&&!/^#[0-9a-fA-F]{6}$/.test(fieldValue))throw new Error("颜色必须使用#RRGGBB格式");form.append(field.name,fieldValue)})
            return form
        }

        async function submit(){
            if(!state.file){showMessage("请先选择图片","error");return}renderResults();clearMessage();setResultBusy(true)
            try{if(state.feature.workflow)await makeIdPhoto();else{setBusy(true,"正在处理");const result=await request(state.feature.endpoint,genericForm());if(result.json)showScores(result.json.data||{});else showImage("single",result.blob,result.type,state.feature.download)}showMessage("处理完成","success")}
            catch(error){let errorMessage=error.message;if(errorMessage==="Failed to fetch")errorMessage="服务链接失败";showMessage(errorMessage,"error")}finally{setResultBusy(false);setBusy(false)}
        }

        inputFile.addEventListener("change",()=>setFile(inputFile.files[0]))
        uploadBox.addEventListener("dragover",event=>{event.preventDefault();uploadBox.classList.add("dragging")})
        uploadBox.addEventListener("dragleave",()=>uploadBox.classList.remove("dragging"))
        uploadBox.addEventListener("drop",event=>{event.preventDefault();uploadBox.classList.remove("dragging");setFile(event.dataTransfer.files[0])})
        start.addEventListener("click",submit)
        renderTabs();selectFeature("idphoto")
    </script>
</body>
</html>
